name: Refresh collection roster

on:
  schedule:
    - cron: "17 20 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh-collection-roster
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run collection:sync
      - name: Commit roster changes
        run: |
          if git diff --quiet; then
            echo "Collection roster is already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/collection-sources/tracker.json data/collection-sources/snapshot.json public/data/gbf-collection.json worker/collection-index.json
          git commit -m "data: refresh collection roster"
          git push
